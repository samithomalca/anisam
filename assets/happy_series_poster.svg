<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Contenido alegre">
  <defs>
    <linearGradient id="hpBg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#4a3410"/>
      <stop offset="55%" stop-color="#553716"/>
      <stop offset="100%" stop-color="#2a1a0c"/>
    </linearGradient>
    <linearGradient id="hpA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="hpGlow" cx="50%" cy="38%" r="58%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="url(#hpBg)"/>
  <circle cx="200" cy="152" r="160" fill="url(#hpGlow)"/>

  <g opacity="0.5" fill="#ffffff">
