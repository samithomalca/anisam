    <circle cx="300" cy="42" r="1.4"/>
    <circle cx="360" cy="110" r="1.6"/>
    <circle cx="70" cy="322" r="1.3"/>
    <circle cx="332" cy="336" r="1.5"/>
  </g>

  <g transform="translate(200 166)">
